<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart home · @motifx-community/ui</title>
    <meta name="description" content="A smart home panel for a tablet, made of the components of @motifx-community/ui." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The design language and theme chosen on the docs site, before the first paint.
      try {
        var i = localStorage.getItem('mx-docs-design-language');
        if (i) document.documentElement.dataset.designLanguage = i;
        var t = localStorage.getItem('mx-docs-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
