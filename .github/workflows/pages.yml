name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# The docs build needs @motifx-community/design-system as a sibling checkout
# (file:../motifjs-design-system) until it is published; see ci.yml.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: motifjs-ui
      - uses: actions/checkout@v4
        with:
          repository: motifjs-community/motifjs-design-system
          path: motifjs-design-system
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            motifjs-ui/package-lock.json
            motifjs-design-system/package-lock.json
      - run: npm ci
        working-directory: motifjs-design-system
      - run: npm run build
        working-directory: motifjs-design-system
      - run: npm ci
        working-directory: motifjs-ui
      - run: npm run docs:build
        working-directory: motifjs-ui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: motifjs-ui/apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
