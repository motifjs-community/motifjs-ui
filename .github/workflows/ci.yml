name: CI

on:
  push:
    branches: [main]
  pull_request:

# The package depends on @motifx-community/design-system as a sibling checkout
# (file:../motifjs-design-system) until it is published: both repositories are
# checked out side by side and the design system is built first.
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          path: motifjs-ui
      - uses: actions/checkout@v4
        with:
          repository: motifjs-community/motifjs-design-system
          path: motifjs-design-system
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            motifjs-ui/package-lock.json
            motifjs-design-system/package-lock.json
      - run: npm ci
        working-directory: motifjs-design-system
      - run: npm run build
        working-directory: motifjs-design-system
      - run: npm ci
        working-directory: motifjs-ui
      - run: npm run typecheck
        working-directory: motifjs-ui
      - run: npm run lint:jsx
        working-directory: motifjs-ui
      - run: npm run lint:css
        working-directory: motifjs-ui
      - run: npm test
        working-directory: motifjs-ui
      - run: npm run build
        working-directory: motifjs-ui
      - run: npm run docs:build
        working-directory: motifjs-ui
      - name: Package contents
        run: npm pack --dry-run
        working-directory: motifjs-ui
