name: CI

on:
  push:
    branches: [main]
  pull_request:

# The design system, the translations and the data layer are dependencies by path (file:../…) until they are
# published: the four repositories are checked out side by side and built in the order they depend on each other.
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          path: motifjs-ui
      - uses: actions/checkout@v4
        with:
          repository: motifjs-community/motifjs-design-system
          path: motifjs-design-system
      - uses: actions/checkout@v4
        with:
          repository: motifjs-community/motifjs-i18n
          path: motifjs-i18n
      - uses: actions/checkout@v4
        with:
          repository: motifjs-community/motifjs-data
          path: motifjs-data
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            motifjs-ui/package-lock.json
            motifjs-design-system/package-lock.json
            motifjs-i18n/package-lock.json
            motifjs-data/package-lock.json
      - run: npm ci && npm run build
        working-directory: motifjs-design-system
      - run: npm ci && npm run build
        working-directory: motifjs-i18n
      - run: npm ci && npm run build
        working-directory: motifjs-data
      - run: npm ci
        working-directory: motifjs-ui
      - run: npm run check
        working-directory: motifjs-ui
      - name: Package contents
        run: npm pack --dry-run
        working-directory: motifjs-ui
